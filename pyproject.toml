[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "watchdock"
version = "0.3.0"
description = "A review-first file organizer and safety gateway for people and AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Hehan Zhao"}
]
keywords = [
    "file-organization",
    "ai",
    "automation",
    "file-management",
    "watchdog",
    "mcp",
    "agent-skills",
    "human-in-the-loop",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

dependencies = [
    "packaging>=23.2,<27",
    "watchdog>=3.0,<7",
]

[project.optional-dependencies]
openai = [
    "openai>=1.0,<4",
]
anthropic = [
    "anthropic>=0.18,<2",
]
ai = [
    "openai>=1.0,<4",
    "anthropic>=0.18,<2",
]
mcp = [
    "mcp>=2.0,<3",
]
dev = [
    "mcp>=2.0,<3",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
]
release = [
    "build>=1.2,<2",
    "check-wheel-contents>=0.6,<1",
    "twine>=5,<8",
]

[project.urls]
Homepage = "https://github.com/Z-MarkUs/watchdock"
Documentation = "https://github.com/Z-MarkUs/watchdock#readme"
Repository = "https://github.com/Z-MarkUs/watchdock"
Issues = "https://github.com/Z-MarkUs/watchdock/issues"

[project.scripts]
watchdock = "watchdock.main:main"
wd = "watchdock.main:main"
watchdock-mcp = "watchdock.mcp_server:main"

[tool.setuptools.packages.find]
include = ["watchdock*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["watchdock"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Keep the initial CI gate focused on parser and name-resolution failures so
# packaging work does not force an unrelated whole-project style rewrite.
select = ["E9", "F63", "F7", "F82"]

