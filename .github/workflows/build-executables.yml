name: Build Executables

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: executables-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    name: ${{ matrix.artifact-suffix }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-suffix: linux-x64
            executable-extension: ""
            gui-extension: ""
          - os: windows-2025
            artifact-suffix: windows-x64
            executable-extension: .exe
            gui-extension: .exe
          - os: macos-15
            artifact-suffix: macos-arm64
            executable-extension: ""
            gui-extension: .app
          - os: macos-15-intel
            artifact-suffix: macos-x64
            executable-extension: ""
            gui-extension: .app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install application and frozen-build tooling
        if: matrix.artifact-suffix != 'macos-x64'
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install ".[ai,mcp]" "pyinstaller==6.22.2"

      - name: Install Intel macOS frozen-build dependencies
        if: matrix.artifact-suffix == 'macos-x64'
        run: |
          python -m pip install "pip==26.2.1"
          # cryptography 49+ does not publish an Intel macOS wheel. Use the
          # final universal2 wheel line so this frozen build never falls back
          # to a runner-local source build linked against Homebrew OpenSSL.
          python -m pip install --only-binary=cryptography ".[ai,mcp]" "cryptography==48.0.1" "pyinstaller==6.22.2"

      - name: Build standalone applications
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --name "watchdock-cli-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}" watchdock/main.py
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name "WatchDock-gui-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}" watchdock/gui_main.py
          python -m PyInstaller --clean --noconfirm --onefile --hidden-import mcp.server --hidden-import mcp.types --copy-metadata mcp --collect-all openai --collect-all anthropic --name "watchdock-mcp-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}" watchdock/mcp_server.py

      - name: Verify distinct CLI, GUI, and MCP applications
        env:
          CLI_APPLICATION: dist/watchdock-cli-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}${{ matrix.executable-extension }}
          GUI_APPLICATION: dist/WatchDock-gui-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}${{ matrix.gui-extension }}
          MCP_APPLICATION: dist/watchdock-mcp-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}${{ matrix.executable-extension }}
        shell: bash
        run: |
          test -e "${CLI_APPLICATION}"
          test -e "${GUI_APPLICATION}"
          test -e "${MCP_APPLICATION}"
          cli_path="$(python -c 'import os; from pathlib import Path; print(Path(os.environ["CLI_APPLICATION"]).resolve())')"
          gui_path="$(python -c 'import os; from pathlib import Path; print(Path(os.environ["GUI_APPLICATION"]).resolve())')"
          mcp_path="$(python -c 'import os; from pathlib import Path; print(Path(os.environ["MCP_APPLICATION"]).resolve())')"
          test "${cli_path}" != "${gui_path}"
          test "${cli_path}" != "${mcp_path}"
          test "${gui_path}" != "${mcp_path}"

      - name: Smoke test CLI executable
        shell: bash
        env:
          CLI_APPLICATION: dist/watchdock-cli-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}${{ matrix.executable-extension }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          "${CLI_APPLICATION}" --help
          test "$("${CLI_APPLICATION}" version)" = "WatchDock ${RELEASE_VERSION}"

      - name: Smoke test MCP executable help
        shell: bash
        env:
          MCP_APPLICATION: dist/watchdock-mcp-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}${{ matrix.executable-extension }}
        run: |
          "${MCP_APPLICATION}" --help

      - name: Exercise frozen MCP executable over stdio
        working-directory: ${{ runner.temp }}
        env:
          WATCHDOCK_MCP_COMMAND: ${{ github.workspace }}/dist/watchdock-mcp-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}${{ matrix.executable-extension }}
        run: python "${{ github.workspace }}/scripts/mcp_stdio_smoke.py"

      - name: Smoke test Windows GUI executable startup
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GUI_EXECUTABLE: dist\WatchDock-gui-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}.exe
          GUI_CONFIG: ${{ runner.temp }}\watchdock-gui-smoke\config.json
        run: |
          $process = Start-Process `
            -FilePath $env:GUI_EXECUTABLE `
            -ArgumentList '--config', $env:GUI_CONFIG `
            -PassThru `
            -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              throw "WatchDock GUI exited during startup with code $($process.ExitCode)"
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Package platform applications
        env:
          ARTIFACT_BASENAME: watchdock-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}
        run: >-
          python -c "import os, pathlib, shutil;
          pathlib.Path('artifacts').mkdir(exist_ok=True);
          shutil.make_archive(str(pathlib.Path('artifacts') / os.environ['ARTIFACT_BASENAME']), 'zip', 'dist')"

      - name: Upload standalone applications
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watchdock-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}
          path: artifacts/watchdock-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  agent:
    name: Build validated agent plugin
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate catalogs and package agent plugin
        run: |
          python scripts/validate_agent_distribution.py
          python scripts/package_agent_plugin.py --output-dir agent-dist
          python scripts/validate_agent_distribution.py --archive "agent-dist/watchdock-agent-${{ needs.validate.outputs.version }}.zip"

      - name: Upload validated agent plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watchdock-${{ needs.validate.outputs.version }}-agent
          path: agent-dist/watchdock-agent-${{ needs.validate.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release-assets:
    name: Create draft release with verified applications and agent plugin
    needs:
      - validate
      - build
      - agent
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: watchdock-${{ needs.validate.outputs.version }}-*
          path: release-assets
          merge-multiple: true

      - name: Verify agent plugin and generate SHA-256 checksums
        working-directory: release-assets
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          test -f "watchdock-agent-${RELEASE_VERSION}.zip"
          sha256sum *.zip | sort -k2 > SHA256SUMS.txt

      - name: Create or update draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" = "true"
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "WatchDock ${RELEASE_VERSION}"
          fi
          gh release upload "${RELEASE_TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

