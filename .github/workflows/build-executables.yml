name: Build Executables

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: executables-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    name: ${{ matrix.artifact-suffix }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-suffix: linux-x64
            executable-extension: ""
          - os: windows-2025
            artifact-suffix: windows-x64
            executable-extension: .exe
          - os: macos-15
            artifact-suffix: macos-arm64
            executable-extension: ""
          - os: macos-15-intel
            artifact-suffix: macos-x64
            executable-extension: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install application and frozen-build tooling
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install ".[ai]" "pyinstaller==6.22.2"

      - name: Build standalone applications
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --name "watchdock-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}" watchdock/main.py
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name "WatchDock-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}" watchdock/gui_main.py

      - name: Smoke test CLI executable
        shell: bash
        run: ./dist/watchdock-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}${{ matrix.executable-extension }} --help

      - name: Smoke test Windows GUI executable startup
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GUI_EXECUTABLE: dist\WatchDock-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}.exe
          GUI_CONFIG: ${{ runner.temp }}\watchdock-gui-smoke\config.json
        run: |
          $process = Start-Process `
            -FilePath $env:GUI_EXECUTABLE `
            -ArgumentList '--config', $env:GUI_CONFIG `
            -PassThru `
            -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              throw "WatchDock GUI exited during startup with code $($process.ExitCode)"
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Package platform applications
        env:
          ARTIFACT_BASENAME: watchdock-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}
        run: >-
          python -c "import os, pathlib, shutil;
          pathlib.Path('artifacts').mkdir(exist_ok=True);
          shutil.make_archive(str(pathlib.Path('artifacts') / os.environ['ARTIFACT_BASENAME']), 'zip', 'dist')"

      - name: Upload standalone applications
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watchdock-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}
          path: artifacts/watchdock-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release-assets:
    name: Create draft release with verified applications
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download platform applications
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: watchdock-${{ needs.validate.outputs.version }}-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        shell: bash
        run: sha256sum *.zip | sort -k2 > SHA256SUMS.txt

      - name: Create or update draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "WatchDock ${RELEASE_VERSION}"
          fi
          gh release upload "${RELEASE_TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

