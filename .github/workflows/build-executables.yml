name: Build Executables

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: executables-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    name: ${{ matrix.artifact-suffix }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-suffix: linux-x64
            executable-extension: ""
          - os: windows-2025
            artifact-suffix: windows-x64
            executable-extension: .exe
          - os: macos-15
            artifact-suffix: macos-arm64
            executable-extension: ""
          - os: macos-15-intel
            artifact-suffix: macos-x64
            executable-extension: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install application and frozen-build tooling
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install ".[ai]" "pyinstaller==6.22.2"

      - name: Build standalone applications
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --name "watchdock-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}" watchdock/main.py
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name "WatchDock-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}" watchdock/gui_main.py

      - name: Smoke test CLI executable
        shell: bash
        run: ./dist/watchdock-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}${{ matrix.executable-extension }} --help

      - name: Upload standalone applications
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watchdock-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}
          path: |
            dist/watchdock-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}*
            dist/WatchDock-${{ needs.validate.outputs.version }}-${{ matrix.artifact-suffix }}*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

