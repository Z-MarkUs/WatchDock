interface:
  display_name: "WatchDock Organize"
  short_description: "Queue files for safe human review"
  default_prompt: "Use $watchdock-organize to analyze this file and queue a proposal for human review."
dependencies:
  tools:
    - type: "mcp"
      value: "watchdock"
      description: "Local WatchDock review-first filesystem tools"
      transport: "stdio"
policy:
  allow_implicit_invocation: true
